[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pando"
version = "0.3.0"
description = "Elastically scalable, heterogeneous, self-replicating unified intelligence (defensive research)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyNaCl>=1.5"]

[project.optional-dependencies]
model = ["transformers>=4.40", "torch>=2.1"]
serve = ["fastapi", "uvicorn"]
lan = ["zeroconf>=0.131"]
onnx = ["onnxruntime>=1.18", "numpy>=1.26"]
cuda = ["onnxruntime-gpu>=1.31"]
runtime = [
  "zeroconf>=0.131",
  "onnxruntime>=1.18",
  "numpy>=1.26",
]

[project.scripts]
pando = "pando.cli:main"

[project.urls]
Repository = "https://github.com/JewelRoam/Pando"
"Research log" = "https://github.com/JewelRoam/Pando/blob/main/docs/evidence/LOG.md"

[tool.setuptools]
packages = ["pando"]

[tool.setuptools.data-files]
"share/pando/assets" = [
  "assets/*.jsonl",
  "assets/*.toml",
  "assets/*.json",
]
"share/pando/assets/registry" = [
  "assets/registry/*.json",
]
"share/pando/assets/calibration" = [
  "assets/calibration/*.json",
]
