name: Multi-process swarm

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swarm.yml"
      - "pando/coordinator.py"
      - "pando/worker.py"
      - "pando/backend.py"
      - "pando/common.py"
      - "pando/spore.py"
      - "pando/join.py"
      - "tools/swarm_check.py"
      - "tools/slow_stem_check.py"
      - "tools/lan_http_check.py"
      - "tools/remote_latency_check.py"
      - "tools/two_group_check.py"
      - "tools/spore_chain.py"
      - "tools/spore_dag_check.py"
      - "tools/spore_root_check.py"
      - "pando/autonomy.py"
      - "tools/autonomy_check.py"
  workflow_dispatch:

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  linux-token-swarm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ring 0 dependencies
        run: python -m pip install --upgrade PyNaCl
      - name: Verify mock swarm has no numpy dependency
        run: |
          set -euxo pipefail
          python -S -c "import numpy" 2>/dev/null && exit 1 || true
          python -S -c "from pando.backend import MockBackend; print('mock backend import without site-packages: ok')"
      - name: Run isolated tokenized swarm lifecycle
        run: python tools/swarm_check.py --yes
      - name: Verify slow-stem timeout, cooldown, and retry
        run: python tools/slow_stem_check.py --yes
      - name: Verify LAN-interface HTTP registration and quorum
        run: python tools/lan_http_check.py --yes
      - name: Verify remote-link degradation, cooldown, and recovery
        run: python tools/remote_latency_check.py --yes
      - name: Verify hierarchical two-group consensus and partition fallback
        run: python tools/two_group_check.py --yes
      - name: Verify Spore generation and parent provenance
        run: python tools/spore_chain.py
      - name: Verify branching Spore reproduction DAG
        run: python tools/spore_dag_check.py
      - name: Verify root spore HTTP surface and peer manifest fetch
        run: python tools/spore_root_check.py
      - name: Verify observe-decide-act gating and quorum policy
        run: python tools/autonomy_check.py --yes
