name: CI
on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pynacl zeroconf onnxruntime onnx
      - name: Static analysis
        run: python -m py_compile pando/*.py tools/*.py
      - name: No weight artifacts in git
        run: python tools/check_no_weights.py
      - name: Smoke tests
        run: python -m unittest discover -s tests -v
      - name: Genesis drills (the group authors its own agenda)
        run: |
          python tools/genesis_check.py
          python tools/genesis_log_check.py
          python tools/genesis_transport_check.py
      - name: Topology planner scenarios
        run: python tools/topology_check.py
      - name: Doctor
        run: python -m pando.doctor --json
      - name: Unified CLI
        run: |
          python -m pando --help
          python -m pando doctor --plan > /dev/null
      - name: Build and verify distributions
        run: |
          python -m pip install build
          python -m build
          python tools/verify_wheel.py dist
          python tools/verify_sdist.py dist

  demo:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pynacl zeroconf
      - name: End-to-end demo
        run: python tools/demo.py
